<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrbitTube</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scrollbar-width: none; /* Firefox */
  }
  html::-webkit-scrollbar {
    display: none; /* Chrome, Safari, Edge */
  }

  body {
    background: #0f0f0f;
    color: #fff;
    font-family: 'Roboto', Arial, sans-serif;
    min-height: 100vh;
    -ms-overflow-style: none; /* IE/Edge */
  }

  /* ── HEADER ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0f0f0f;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 24px;
    height: 56px;
    border-bottom: 1px solid #272727;
  }

  .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-decoration: none;
    white-space: nowrap;
  }
  .logo .orbit { color: #fff; }
  .logo .tube { color: #ff0000; }

  .search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 580px;
    justify-self: center;
  }

  .search-wrap input {
    flex: 1;
    height: 38px;
    background: #121212;
    border: 1px solid #303030;
    border-radius: 40px;
    color: #fff;
    font-size: 15px;
    padding: 0 18px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input::placeholder { color: #717171; }
  .search-wrap input:focus { border-color: #3ea6ff; }

  .search-btn {
    width: 62px;
    height: 38px;
    background: #222;
    border: 1px solid #303030;
    border-radius: 40px;
    cursor: pointer;
    color: #aaa;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .search-btn:hover { background: #333; color: #fff; }

  /* ── MAIN ── */
  main {
    padding: 24px 32px 48px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* ── SECTION HEADERS ── */
  .section-label {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #fff;
  }

  .section { margin-bottom: 40px; }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }

  /* ── CARD ── */
  .card {
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    background: #181818;
  }
  .card:hover {
    transform: scale(1.045);
    box-shadow: 0 8px 32px rgba(0,0,0,0.55);
    z-index: 2;
    position: relative;
  }

  .thumb-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #222;
    overflow: hidden;
    position: relative;
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-info {
    padding: 10px 12px 14px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #333;
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .avatar-initials {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }

  .meta { flex: 1; min-width: 0; }

  .video-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: #fff;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .creator-name {
    font-size: 13px;
    color: #aaa;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── NO RESULTS ── */
  .no-results {
    display: none;
    padding: 60px 0;
    text-align: center;
    color: #717171;
    font-size: 16px;
  }
  .no-results.visible { display: block; }

  /* ── SEARCH RESULTS LABEL ── */
  .search-results-label {
    display: none;
    font-size: 15px;
    color: #aaa;
    margin-bottom: 20px;
  }
  .search-results-label.visible { display: block; }
  .search-results-label span { color: #fff; font-weight: 600; }

  /* ── HIDDEN ── */
  .hidden { display: none !important; }
</style>

<body>

function avatarColor(name) {
  const colors = ['#e53935','#8e24aa','#1e88e5','#00897b','#f4511e','#3949ab','#039be5','#43a047'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return colors[Math.abs(h) % colors.length];
}

function buildCard(v) {
  const initials = v.creator.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
  const bg = avatarColor(v.creator);
  const avatarHTML = v.avatar
    ? `<img src="${v.avatar}" alt="${v.creator}">`
    : `<div class="avatar-initials" style="background:${bg}">${initials}</div>`;

  return `
    <a class="card" href="${v.link}" target="_blank" rel="noopener" data-title="${v.title.toLowerCase()}" data-creator="${v.creator.toLowerCase()}">
      <div class="thumb-wrap">
        <img src="${v.thumb}" alt="${v.title}" loading="lazy" onerror="this.style.background='#333';this.src='https://via.placeholder.com/480x270/222/666?text=No+Image'">
      </div>
      <div class="card-info">
        <div class="avatar">${avatarHTML}</div>
        <div class="meta">
          <p class="video-title">${v.title}</p>
          <p class="creator-name">${v.creator}</p>
        </div>
      </div>
    </a>`;
}

document.getElementById('gridRecommended').innerHTML = RECOMMENDED.map(buildCard).join('');
document.getElementById('gridAll').innerHTML        = ALL_VIDEOS.map(buildCard).join('');

const searchInput = document.getElementById('searchInput');
const secRec      = document.getElementById('sectionRecommended');
const secAll      = document.getElementById('sectionAll');
const gridSearch  = document.getElementById('gridSearch');
const noResults   = document.getElementById('noResults');
const searchLabel = document.getElementById('searchLabel');
const searchTerm  = document.getElementById('searchTerm');
const ALL_CARDS   = [...RECOMMENDED, ...ALL_VIDEOS];

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    secRec.classList.remove('hidden');
    secAll.classList.remove('hidden');
    gridSearch.style.display = 'none';
    noResults.classList.remove('visible');
    searchLabel.classList.remove('visible');
    return;
  }
  secRec.classList.add('hidden');
  secAll.classList.add('hidden');
  gridSearch.style.display = 'grid';
  searchTerm.textContent = `"${searchInput.value.trim()}"`;
  searchLabel.classList.add('visible');
  const hits = ALL_CARDS.filter(v =>
    v.title.toLowerCase().includes(q) || v.creator.toLowerCase().includes(q)
  );
  if (hits.length === 0) {
    gridSearch.innerHTML = '';
    noResults.classList.add('visible');
  } else {
    gridSearch.innerHTML = hits.map(buildCard).join('');
    noResults.classList.remove('visible');
  }
});

document.querySelector('.search-btn').addEventListener('click', () => searchInput.focus());

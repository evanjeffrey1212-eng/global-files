<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Media Library</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    width: 100%;
    overflow-x: hidden;
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE/Edge */
  }

  html::-webkit-scrollbar { display: none; } /* Chrome/Safari/Opera */

  body {
    background: #0a0a0a;
    color: #f0ede8;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    padding: 16px 16px calc(40px + env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }

  .search-wrap {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto 16px;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.35;
    pointer-events: none;
  }

  #search {
    width: 100%;
    height: 46px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    color: #f0ede8;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 300;
    padding: 0 14px 0 42px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.2s, background 0.2s;
  }

  #search::placeholder { color: #888580; }
  #search:focus {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.2);
  }

  .grid {
    display: grid;
    gap: 10px;
    width: 100%;
    grid-template-columns: repeat(6, 1fr);
  }

  @media (max-width: 1023px) {
    .grid { grid-template-columns: repeat(5, 1fr); gap: 9px; }
  }

  @media (max-width: 767px) {
    .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  }

  @media (max-width: 599px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 7px; }
    body { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); padding-top: 12px; }
  }

  @media (max-width: 430px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    body { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
  }

  .card-wrap {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    min-width: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .card-wrap.hidden { display: none; }

  .card {
    border-radius: 9px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 2 / 3;
    width: 100%;
    background: #1c1c1c;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: filter 0.25s ease;
  }

  .card-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  @media (hover: hover) and (pointer: fine) {
    .card-wrap:hover .card { transform: scale(1.04); }
    .card-wrap:hover .card img { filter: brightness(0.8); }
    .card-wrap:hover .card-overlay { opacity: 1; }
  }

  @media (hover: none) {
    .card-wrap:active .card img { filter: brightness(0.55); }
    .card-wrap:active .card-overlay { opacity: 1; }
  }

  .card-info { padding: 5px 1px 0; min-width: 0; }

  .card-title {
    font-size: 11px;
    font-weight: 500;
    color: #f0ede8;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-meta {
    font-size: 9px;
    color: #888580;
    font-weight: 400;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @media (min-width: 768px) {
    .card-title { font-size: 13px; }
    .card-meta  { font-size: 11px; }
    .card-info  { padding: 6px 2px 0; }
  }

  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 5rem 0;
    color: #888580;
    font-size: 15px;
    font-weight: 300;
  }
  .no-results span { display: block; font-size: 36px; margin-bottom: 12px; opacity: 0.3; }
</style>
</head>
<body>

<div class="search-wrap">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <circle cx="6.5" cy="6.5" r="5" stroke="white" stroke-width="1.5"/>
    <path d="M10.5 10.5L14 14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <input type="text" id="search" placeholder="Search all animes..." autocomplete="off" spellcheck="false">
</div>

<div class="grid" id="grid"></div>

{ title: "Toriko X One Piece Collaboration Special", year: "2026", type: "Action", url: "https://drive.google.com/drive/folders/1DRtfxvepXZiu53v2dlNrXGkz0Yw6oA4h", image: "https://cdn.phototourl.com/free/2026-05-01-c48eb742-504e-4a0c-895e-7ea0d5a2c0c4.png" },
{ title: "Ace Attorney", year: "2016", type: "Comedy Drama", url: "https://drive.google.com/drive/u/0/folders/1oiTD4MSCwf8IEJdNk-mJGq_NZ5xRMkA1", image: "https://cdn.phototourl.com/free/2026-05-01-42445fe8-129e-4010-97ca-1ad7dcf0f546.png" },
];

const grid = document.getElementById('grid');
const searchEl = document.getElementById('search');

function buildCards() {
  grid.innerHTML = '';
  MEDIA.forEach(item => {
    if (!item.url || item.url === 'driveurl') return;

    const wrap = document.createElement('a');
    wrap.className = 'card-wrap';
    wrap.href = item.url;
    wrap.target = '_blank';
    wrap.rel = 'noopener noreferrer';
    wrap.dataset.title = item.title.toLowerCase();
    wrap.dataset.type = (item.type || '').toLowerCase();
    wrap.dataset.year = item.year || '';

    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.alt = item.title;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.src = (item.image && item.image !== 'imageurlhere') ? item.image : '';
    img.onerror = function() { this.style.display = 'none'; };

    const overlay = document.createElement('div');
    overlay.className = 'card-overlay';

    card.appendChild(img);
    card.appendChild(overlay);

    const info = document.createElement('div');
    info.className = 'card-info';
    info.innerHTML =
      `<div class="card-title">${item.title}</div>` +
      `<div class="card-meta">${[item.year, item.type].filter(Boolean).join(' \u2022 ')}</div>`;

    wrap.appendChild(card);
    wrap.appendChild(info);
    grid.appendChild(wrap);
  });
}

function filterCards(query) {
  const q = query.trim().toLowerCase();
  let visible = 0;
  grid.querySelectorAll('.card-wrap').forEach(wrap => {
    const match = !q ||
      wrap.dataset.title.includes(q) ||
      wrap.dataset.type.includes(q) ||
      wrap.dataset.year.includes(q);
    wrap.classList.toggle('hidden', !match);
    if (match) visible++;
  });
  let noRes = grid.querySelector('.no-results');
  if (visible === 0) {
    if (!noRes) {
      noRes = document.createElement('div');
      noRes.className = 'no-results';
      grid.appendChild(noRes);
    }
    noRes.innerHTML = '<span>■</span>No animes found for "' + query.trim() + '"';
  } else if (noRes) {
    noRes.remove();
  }
}

searchEl.addEventListener('input', e => filterCards(e.target.value));

MEDIA.sort((a, b) => {
  const aNum = /^\d/.test(a.title), bNum = /^\d/.test(b.title);
  if (aNum && !bNum) return -1;
  if (!aNum && bNum) return 1;
  return a.title.localeCompare(b.title);
});

buildCards();
</script>
</body>
</html>
